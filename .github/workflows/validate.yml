name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile manager
        run: python -m py_compile scripts/manage.py
      - name: Validate public-safe base configuration
        shell: pwsh
        run: .\manage.ps1 validate -BaseOnly

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
